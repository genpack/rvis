# Shiny gallery: Faithful (shiny-examples 083-front-page)
# https://shiny.posit.co/r/gallery/start-simple/faithful/
name: Faithful
layout: page
items:
  page:
    type: fluidPage
    layout: [n_breaks, individual_obs, density, main_plot, bandwidth]

  n_breaks:
    type: selectInput
    title: "Number of bins in histogram (approximate):"
    choices: [10, 20, 35, 50]
    selected: 20

  individual_obs:
    type: checkboxInput
    title: Show individual observations
    value: false

  density:
    type: checkboxInput
    title: Show density estimate
    value: false

  main_plot:
    type: plotOutput
    height: 300px
    service: |
      hist(faithful$eruptions,
        probability = TRUE,
        breaks = as.numeric(input$n_breaks),
        xlab = "Duration (minutes)",
        main = "Geyser eruption duration")
      if (input$individual_obs) {
        rug(faithful$eruptions)
      }
      if (input$density) {
        dens <- density(faithful$eruptions, adjust = input$bw_adjust)
        lines(dens, col = "blue")
      }

  # Display this only if the density is shown
  bandwidth:
    type: conditionalPanel
    condition: input.density == true
    layout: [bw_adjust]

  bw_adjust:
    type: sliderInput
    title: "Bandwidth adjustment:"
    min: 0.2
    max: 2
    value: 1
    step: 0.2
