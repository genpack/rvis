# Shiny gallery: Sliders (shiny-examples 005-sliders)
# https://shiny.posit.co/r/gallery/widgets/sliders/
name: Sliders
layout: page

prescript: |
  sliderValues <- reactive({
    data.frame(
      Name = c("Integer", "Decimal", "Range", "Custom Format", "Animation"),
      Value = as.character(c(input$integer,
                             input$decimal,
                             paste(input$range, collapse = " "),
                             input$format,
                             input$animation)),
      stringsAsFactors = FALSE)
  })

items:
  page:
    type: sidebarLayout
    title: Sliders
    layout.side: [integer, decimal, range, format, animation]
    layout.main: [values]

  integer:
    type: sliderInput
    title: "Integer:"
    min: 0
    max: 1000
    value: 500

  decimal:
    type: sliderInput
    title: "Decimal:"
    min: 0
    max: 1
    value: 0.5
    step: 0.1

  range:
    type: sliderInput
    title: "Range:"
    min: 1
    max: 1000
    value: [200, 500]

  format:
    type: sliderInput
    title: "Custom Format:"
    min: 0
    max: 10000
    value: 0
    step: 2500
    pre: $
    sep: ","
    animate: true

  animation:
    type: sliderInput
    title: "Looping Animation:"
    min: 1
    max: 2000
    value: 1
    step: 10
    animate: !expr shiny::animationOptions(interval = 300, loop = TRUE)

  values:
    type: tableOutput
    service: sliderValues()
