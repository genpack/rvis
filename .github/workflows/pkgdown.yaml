# Builds the pkgdown website of rvis and publishes it to the gh-pages branch (GitHub Pages).
# Based on the pkgdown workflow of r-lib/actions: https://github.com/r-lib/actions/tree/v2/examples
#
# - on a push to master (and on a release, or when started by hand): builds the site and publishes it
# - on a pull request: builds the site to check it, without publishing
#
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "Deploy from a branch",
# branch "gh-pages", folder "/ (root)" (the branch is made by the first run of this workflow).
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one publishing run at a time
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # rvis with its dependencies (rutils comes from GitHub, see Remotes in DESCRIPTION), pkgdown, and the
      # plotting and shiny packages used by the examples of the guides. Examples whose package is not
      # installed are shown as code only.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            any::rAmCharts
            any::billboarder
            any::c3
            any::dygraphs
            any::echarts4r
            any::apexcharter
            any::ggvis
            any::googleVis
            any::highcharter
            any::networkD3
            any::plotly
            any::rpivotTable
            any::visNetwork
            any::DT
            any::DiagrammeR
            any::leaflet
            any::wordcloud2
            any::sunburstR
            any::shiny
            any::shinydashboard
            any::shinyWidgets
            any::shinyBS
            any::shinyjs
            any::rintrojs
            any::shinythemes
            any::yaml
            any::jsonlite
            github::ramnathv/rCharts
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
